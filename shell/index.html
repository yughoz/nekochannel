<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Nekochannel</title>
<style>
  :root { --bg: #111b21; --panel: #202c33; --hover: #2a3942; --txt: #e9edef; --dim: #8696a0;
    --border: #111b21; --ok: #25d366; --warn: #f2c33c; --err: #f15c6d; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f0f2f5; --panel: #ffffff; --hover: #e9edef; --txt: #111b21; --dim: #667781; --border: #d1d7db; }
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--txt);
    font: 13px/1.45 system-ui, sans-serif; overflow: hidden; }
  #sidebar { position: fixed; inset: 0 auto 0 0; width: 232px; box-sizing: border-box; display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--border); user-select: none; }
  .brand { padding: 14px 14px 10px; font-weight: 600; font-size: 14px; opacity: .9;
    display: flex; align-items: center; gap: 6px; }
  #channels { flex: 1; overflow-y: auto; padding: 0 6px; }
  .group-head { display: flex; align-items: center; justify-content: space-between;
    padding: 8px 8px 2px; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .acc { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 7px;
    cursor: pointer; white-space: nowrap; }
  .acc:hover { background: var(--hover); }
  .acc.active { background: #005c4b; }
  .acc.drop-top { box-shadow: 0 -2px 0 var(--ok); }
  .acc.drop-bottom { box-shadow: 0 2px 0 var(--ok); }
  .acc .label { overflow: hidden; text-overflow: ellipsis; }
  .acc .dockbtn, .brand .dockbtn { margin-left: auto; flex: none; border: none; background: none; color: var(--dim);
    font: inherit; padding: 2px 5px; border-radius: 5px; cursor: pointer; }
  .acc .dockbtn:hover, .brand .dockbtn:hover { background: var(--hover); color: var(--txt); }
  /* #23 rail collapsed 56px: target sentuh enak diklik, label tetap tooltip row.title */
  #sidebar.collapsed { width: 56px; }
  #sidebar.collapsed .brand { padding: 10px 2px; justify-content: center; }
  #sidebar.collapsed .brand .dockbtn { margin-left: 0; }
  #sidebar.collapsed #brand-txt, #sidebar.collapsed .label, #sidebar.collapsed .group-head,
  #sidebar.collapsed #srvlabel { display: none; }
  #sidebar.collapsed .acc { justify-content: center; padding: 7px 0; gap: 0; overflow: hidden; }
  #sidebar.collapsed .acc .em, #sidebar.collapsed .acc .ic, #sidebar.collapsed .acc .dot { flex: none; }
  #sidebar.collapsed .acc .ic { width: 24px; height: 24px; font-size: 14px; }
  #sidebar.collapsed #channels { padding: 0 4px; }
  #sidebar.collapsed #bottom { padding: 8px 4px; }
  #sidebar.collapsed .brand .dockbtn { min-width: 40px; min-height: 40px; font-size: 20px; padding: 0; }
  #sidebar.collapsed .acc .em { font-size: 18px; line-height: 24px; }
  /* Agent di rail: 🤖 di atas, tombol dock di bawahnya (dulu berdempet dan emoji terpotong). */
  #sidebar.collapsed #agent-tab { flex-direction: column; gap: 2px; padding: 6px 0 4px; }
  #sidebar.collapsed #agent-tab .dockbtn { margin: 0; width: 40px; height: 30px; padding: 0; font-size: 16px; line-height: 1; }
  #sidebar.collapsed .addbtn { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; margin: 4px auto 6px;
    padding: 0; font-size: 0; }
  #sidebar.collapsed .addbtn::after { content: '+'; font-size: 20px; line-height: 1; }
  #sidebar.collapsed .srv { justify-content: center; padding: 8px 0; }
  #sidebar.collapsed .srv .dot { width: 20px; height: 20px; }
  .acc .label input { width: 100%; font: inherit; color: var(--txt); background: var(--bg);
    border: 1px solid var(--dim); border-radius: 4px; padding: 0 4px; }
  .acc .ic { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
    font-size: 12px; color: #fff; }
  .dot { flex: none; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
  .dot.connected, .dot.ok { background: var(--ok); }
  .dot.qr, .dot.reconnecting { background: var(--warn); }
  .dot.loading { background: var(--dim); }
  .dot.error { background: var(--err); }
  .addbtn { margin: 4px 8px 6px; padding: 6px 8px; border-radius: 7px; border: 1px dashed var(--dim);
    background: none; color: var(--dim); font: inherit; cursor: pointer; text-align: left; width: calc(100% - 16px); }
  .addbtn:hover { background: var(--hover); color: var(--txt); }
  #bottom { padding: 8px; border-top: 1px solid var(--border); }
  .srv { display: flex; align-items: center; gap: 8px; padding: 4px 8px; color: var(--dim); font-size: 12px; }
  /* #14 quick switcher */
  #switcher { position: fixed; z-index: 20; top: 60px; left: 50%; transform: translateX(-50%);
    width: 340px; display: none; background: var(--panel); border: 1px solid var(--border);
    border-radius: 9px; box-shadow: 0 8px 28px rgba(0,0,0,.45); overflow: hidden; }
  #switcher input { width: 100%; box-sizing: border-box; padding: 9px 12px; border: none; outline: none;
    background: var(--bg); color: var(--txt); font: inherit; border-bottom: 1px solid var(--border); }
  .sw-row { display: flex; align-items: center; gap: 8px; padding: 7px 12px; cursor: pointer; }
  .sw-row.active { background: #005c4b; }
  .sw-ic { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
    font-size: 12px; color: #fff; background: var(--hover); }
  .sw-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sw-chan { margin-left: auto; color: var(--dim); font-size: 11px; }
  .sw-empty { padding: 10px 12px; color: var(--dim); }
</style>
</head>
<body>
  <div id="sidebar">
    <div class="brand"><span id="brand-txt"><img src="../build/icon.png" style="width:18px;height:18px;vertical-align:-4px;border-radius:4px" alt=""> Nekochannel</span><button class="dockbtn" id="sb-toggle"></button></div>
    <div id="channels"></div>
    <div id="bottom">
      <div class="acc" id="agent-tab"><span class="em">🤖</span><span class="label">Agent</span><button class="dockbtn" id="agent-dock" aria-label="dock kanan"></button></div>
      <div class="acc" id="settings-tab"><span class="em">⚙️</span><span class="label" id="settings-label"></span></div>
      <div class="srv"><span class="dot" id="srvdot"></span><span id="srvlabel">wa-reader 4317</span></div>
    </div>
  </div>
  <div id="switcher">
    <input id="sw-input" autocomplete="off" spellcheck="false">
    <div id="sw-list"></div>
  </div>
<script src="switcher.js"></script>
<script>
  const state = { accounts: [], activeId: null, agentDock: false, sidebarCollapsed: false, server: {}, lang: 'id', notif: true };
  const channelsEl = document.getElementById('channels');
  const T = window.neko.strings;
  const t = k => (T?.[state.lang] ?? T?.id ?? {})[k] ?? k;
  const icColor = id => `hsl(${[...id].reduce((s, c) => s + c.charCodeAt(0), 0) * 47 % 360} 40% 42%)`;

  function editLabel(span, a) {
    const acc = span.closest('.acc');
    acc.draggable = false; // jangan drag saat edit
    const input = document.createElement('input');
    input.value = a.label;
    span.textContent = '';
    span.appendChild(input);
    input.focus();
    input.select();
    const commit = () => { acc.draggable = true; window.neko.rename(a.id, input.value); };
    input.onblur = commit;
    input.onkeydown = e => { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { input.onblur = null; render(); } };
  }

  function labelEl(a) {
    const span = document.createElement('span');
    span.className = 'label';
    span.textContent = a.label;
    span.title = `${a.id}${a.account ? ' · ' + a.account : ''}\n${a.status?.detail || ''} (${a.status?.state})`;
    span.ondblclick = () => editLabel(span, a);
    return span;
  }

  function render() {
    document.documentElement.lang = state.lang === 'en' ? 'en' : 'id';
    const channels = [...new Set(state.accounts.map(a => a.channel))];
    channelsEl.textContent = '';
    for (const name of channels) {
      const head = document.createElement('div');
      head.className = 'group-head';
      head.textContent = name;
      channelsEl.appendChild(head);
      for (const a of state.accounts.filter(x => x.channel === name)) {
        const row = document.createElement('div');
        row.className = 'acc' + (state.activeId === a.id ? ' active' : '');
        row.dataset.id = a.id;
        row.title = a.label; // #18: hover di rail collapsed tetap tunjuk label
        const dot = document.createElement('span');
        dot.className = 'dot ' + (a.status?.state || 'loading');
        row.appendChild(dot);
        const ic = document.createElement('span'); // #15: icon akun, default inisial
        ic.className = 'ic';
        ic.textContent = a.icon || (a.label.trim()[0] || '?').toUpperCase();
        ic.style.background = icColor(a.id);
        row.appendChild(ic);
        row.appendChild(labelEl(a));
        row.onclick = () => window.neko.setActive(a.id);
        row.oncontextmenu = e => { e.preventDefault(); if (e.target.tagName !== 'INPUT') window.neko.accountMenu(a.id); };
        row.draggable = true;
        row.ondragstart = e => { e.dataTransfer.setData('text/plain', a.id); e.dataTransfer.effectAllowed = 'move'; };
        row.ondragover = e => {
          if (e.dataTransfer.types.includes('text/plain')) e.preventDefault();
          const after = e.clientY - row.getBoundingClientRect().top > row.offsetHeight / 2;
          row.classList.toggle('drop-top', !after);
          row.classList.toggle('drop-bottom', after);
        };
        row.ondragleave = () => row.classList.remove('drop-top', 'drop-bottom');
        row.ondrop = e => {
          e.preventDefault();
          row.classList.remove('drop-top', 'drop-bottom');
          const src = state.accounts.find(x => x.id === e.dataTransfer.getData('text/plain'));
          if (!src || src.channel !== a.channel || src.id === a.id) return;
          const after = e.clientY - row.getBoundingClientRect().top > row.offsetHeight / 2;
          const order = state.accounts.map(x => x.id);
          order.splice(order.indexOf(src.id), 1);
          const di = order.indexOf(a.id);
          order.splice(after ? di + 1 : di, 0, src.id);
          window.neko.reorder(order);
        };
        channelsEl.appendChild(row);
      }
      const add = document.createElement('button');
      add.className = 'addbtn';
      add.id = `add-${name}`;
      add.textContent = t('addAccount');
      add.title = `${t('addAccount').replace(/^\+\s*/, '')} (${name})`; // tooltip di rail, teks disembunyikan
      add.onclick = () => window.neko.add(name);
      channelsEl.appendChild(add);
    }
    document.getElementById('agent-tab').classList.toggle('active', state.activeId === 'agent' || state.agentDock);
    const dockBtn = document.getElementById('agent-dock');
    dockBtn.textContent = state.agentDock ? '◨' : '◫';
    dockBtn.title = t('agentDockTip');
    document.getElementById('settings-label').textContent = t('settingsTab');
    // Tooltip untuk rail collapsed (label disembunyikan).
    document.getElementById('agent-tab').title = 'Agent';
    document.getElementById('settings-tab').title = t('settingsTab');
    document.getElementById('sidebar').classList.toggle('collapsed', !!state.sidebarCollapsed); // #18
    const sbBtn = document.getElementById('sb-toggle');
    sbBtn.textContent = state.sidebarCollapsed ? '»' : '«';
    sbBtn.title = t('sbToggle');
    swInput.placeholder = t('swPlaceholder');
    document.getElementById('srvdot').className = 'dot ' + (state.server?.enabled === false ? '' : state.server?.ok ? 'ok' : 'error');
    document.getElementById('srvlabel').textContent = t(state.server?.enabled === false ? 'readerOff' : state.server?.ok ? 'readerConnected' : 'readerDisconnected');
  }

  window.neko.onState(s => { Object.assign(state, s); render(); });
  window.neko.state().then(s => { Object.assign(state, s); render(); });
  document.getElementById('agent-tab').onclick = () => window.neko.setActive('agent');
  document.getElementById('agent-dock').onclick = e => { e.stopPropagation(); window.neko.agentDock(); };
  document.getElementById('sb-toggle').onclick = () => window.neko.sidebarToggle(); // #18
  document.getElementById('settings-tab').onclick = () => window.neko.openSettings();

  // #23b: aksi menu native balik ke shell — rename tetap expand-first, aksi lain pakai IPC lama.
  window.neko.onAccountMenu(({ action, id }) => {
    if (action === 'rename') {
      const a = state.accounts.find(x => x.id === id);
      if (!a) return;
      const edit = () => {
        const span = channelsEl.querySelector(`.acc[data-id="${a.id}"] .label`);
        if (span) editLabel(span, a);
      };
      if (!state.sidebarCollapsed) return edit();
      window.neko.sidebarToggle(); // #18: label tersembunyi di rail — expand dulu, edit setelah render
      const iv = setInterval(() => { if (!state.sidebarCollapsed) { clearInterval(iv); edit(); } }, 50);
    }
    else if (action === 'reload') window.neko.reload(id);
    else if (action === 'delete') window.neko.remove(id);
  });

  // ---- #14 quick switcher (Ctrl+K) — filter nama/channel, Enter = pindah, Esc = tutup
  const swEl = document.getElementById('switcher');
  const swInput = document.getElementById('sw-input');
  const swList = document.getElementById('sw-list');
  let swRows = [], swSel = 0;
  const swPaint = () => [...swList.querySelectorAll('.sw-row')].forEach((r, i) => r.classList.toggle('active', i === swSel));
  function swRender() {
    swRows = nekoSwitcher.filter(nekoSwitcher.items(state.accounts), swInput.value);
    swSel = Math.min(swSel, Math.max(swRows.length - 1, 0));
    swList.textContent = '';
    for (const [i, it] of swRows.entries()) {
      const row = document.createElement('div');
      row.className = 'sw-row' + (i === swSel ? ' active' : '');
      const ic = document.createElement('span');
      ic.className = 'sw-ic';
      if (it.type === 'agent') ic.textContent = '🤖';
      else {
        ic.textContent = it.icon || (it.label.trim()[0] || '?').toUpperCase(); // icon #15 kalau sudah ada, else inisial
        ic.style.background = icColor(it.id);
      }
      const label = document.createElement('span');
      label.className = 'sw-label';
      label.textContent = it.label;
      row.append(ic, label);
      if (it.channel) {
        const ch = document.createElement('span');
        ch.className = 'sw-chan';
        ch.textContent = it.channel;
        row.appendChild(ch);
      }
      if (it.id === 'settings') row.querySelector('.sw-ic').textContent = '⚙️';
      row.onclick = () => swGo(it);
      swList.appendChild(row);
    }
    if (!swRows.length) {
      const empty = document.createElement('div');
      empty.className = 'sw-empty';
      empty.textContent = t('swEmpty');
      swList.appendChild(empty);
    }
  }
  const swShow = () => { swEl.style.display = 'block'; swInput.value = ''; swSel = 0; swRender(); swInput.focus(); };
  const swGo = it => { swEl.style.display = 'none'; window.neko.setActive(it.id); };
  swInput.addEventListener('input', () => { swSel = 0; swRender(); });
  swInput.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const n = swRows.length;
      if (!n) return;
      swSel = (swSel + (e.key === 'ArrowDown' ? 1 : -1) + n) % n;
      swPaint();
    } else if (e.key === 'Enter' && swRows[swSel]) { e.preventDefault(); swGo(swRows[swSel]); }
    else if (e.key === 'Escape') { e.preventDefault(); swEl.style.display = 'none'; }
  });
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey) {
      const k = e.key.toLowerCase();
      if (k === 'k') { e.preventDefault(); swShow(); }
      else if (k === 'b') { e.preventDefault(); window.neko.sidebarToggle(); } // #18 saat fokus di shell
    }
    else if (e.key === 'Escape') { // #23: overlay terluar dulu, lalu switcher
      if (swEl.style.display === 'block') swEl.style.display = 'none';
    }
  });
  document.addEventListener('click', e => { if (!swEl.contains(e.target)) swEl.style.display = 'none'; });
  window.neko.onSwitcher(swShow);
</script>
</body>
</html>
