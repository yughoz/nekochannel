<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Pengaturan</title>
<style>
  :root { --bg: #111b21; --panel: #202c33; --txt: #e9edef; --dim: #8696a0;
    --border: #2a3942; --ok: #25d366; --err: #f15c6d; }
  html, body { margin: 0; background: var(--bg); color: var(--txt);
    font: 13px/1.5 system-ui, sans-serif; }
  body { height: 100vh; overflow: hidden; }
  /* Tinggi dikunci ke viewport supaya main/nav yang scroll sendiri, bukan body (overflow hidden). */
  .layout { display: flex; height: 100vh; }
  #settings-close { margin: 0 0 12px; width: 100%; background: #22313a; color: var(--dim); }
  nav[aria-label] { flex: 0 0 220px; padding: 14px 10px; background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; box-sizing: border-box; }
  nav button { display: block; width: 100%; margin: 3px 0; padding: 10px 12px; border-radius: 8px; background: transparent; color: var(--dim); text-align: left; }
  nav button.active { background: #1769aa; color: #fff; font-weight: 600; }
  main { flex: 1; overflow: auto; padding: 20px 24px; box-sizing: border-box; }
  section[hidden] { display: none !important; }
  h2 { margin-top: 0; }
  h3 { font-size: 12px; margin: 16px 0 4px; color: var(--dim, #888); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--dim); margin: 18px 0 8px; }
  label { display: block; margin: 8px 0 2px; color: var(--dim); font-size: 12px; }
  input[type=text], input[type=password], input[type=number], input[type=time], input[type=search], select, textarea { width: 100%; box-sizing: border-box;
    padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--panel); color: var(--txt); font: inherit; }
  .hint { color: var(--dim); font-size: 12px; margin: 6px 0; }
  textarea { resize: vertical; min-height: 54px; }
  .sched { border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px 10px; margin: 12px 0; }
  .sched pre, .sched-run pre { white-space: pre-wrap; font: inherit; font-size: 12px; margin: 6px 0; color: var(--txt); }
  .sched-run { font-size: 12px; color: var(--dim); margin: 4px 0; }
  .sched.invalid { border-color: var(--err); }
  .sched .sched-err { color: var(--err); font-size: 12px; margin: 6px 0 0; }
  .sched-group-list { max-height: 240px; overflow: auto; border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; margin-top: 6px; }
  .sched-group { margin: 3px 0; color: var(--txt); font-size: 13px; }
  .sched-group .hint { margin: 0 0 0 auto; }
  .sched-groups.blur .sched-group span.gname { filter: blur(5px); }
  .sched-groups.blur:hover .sched-group span.gname { filter: none; }
  .row { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
  button { padding: 7px 18px; border: none; border-radius: 7px;
    background: #1769aa; color: #fff; font: inherit; cursor: pointer; }
  button:hover { filter: brightness(1.15); }
  button:disabled { opacity: .45; cursor: default; filter: none; }
  button.ghost { background: none; color: var(--dim); padding: 7px 4px; }
  button.ghost.armed { color: var(--err); }
  .check { display: flex; align-items: center; gap: 8px; margin: 6px 0; cursor: pointer; }
  label[for=reader] { min-block-size: 44px; }
  .saved { color: var(--ok); font-size: 12px; min-height: 16px; margin: 6px 0; }
  .live { color: var(--dim); font-size: 12px; }
  #backfill-bar { display: block; width: 100%; height: 8px; margin: 12px 0 2px; appearance: none; border: none;
    border-radius: 4px; overflow: hidden; background: var(--panel); }
  #backfill-bar[hidden] { display: none; }
  #backfill-bar::-webkit-progress-bar { background: var(--panel); }
  #backfill-bar::-webkit-progress-value { background: var(--ok); transition: width .3s; }
  #backfill-bar[data-status=paused]::-webkit-progress-value { background: #f2c33c; }
  #backfill-bar[data-status=error]::-webkit-progress-value { background: var(--err); }
  a { color: #53bdeb; }
</style>
</head>
<body><div class="layout">
  <nav aria-label="Settings sections"><button type="button" id="settings-close" aria-label="Close settings">✕</button><div id="settings-nav">
    <button type="button" id="nav-general"></button>
    <button type="button" id="nav-reader"></button>
    <button type="button" id="nav-privacy"></button>
    <button type="button" id="nav-integrations"></button>
    <button type="button" id="nav-llm"></button>
    <button type="button" id="nav-schedule"></button>
    <button type="button" id="nav-about"></button>
  </div></nav>
  <main>
  <section id="panel-reader" tabindex="-1">
  <h2 id="h-reader"></h2>
  <label class="check" for="reader"><input type="checkbox" id="reader" aria-describedby="reader-hint"> <span id="reader-label"></span></label>
  <p class="hint" id="reader-hint"></p>
  <label for="backfill-account" id="backfill-account-label"></label>
  <select id="backfill-account"></select>
  <div class="row"><button id="backfill-start"></button><button id="backfill-pause"></button></div>
  <progress id="backfill-bar" max="100" hidden></progress>
  <p id="backfill-text" class="hint" role="status" aria-live="polite"></p>
  <p id="reader-result" role="status"></p>
  </section>
  <section id="panel-privacy" tabindex="-1">
  <h2 id="h-privacy"></h2>
  <div id="privacy-targets"></div>
  <p class="hint" id="privacy-hint"></p>
  <label id="l-lock-password" for="lock-password"></label>
  <input type="password" id="lock-password" autocomplete="new-password" minlength="8" maxlength="256" aria-describedby="lock-password-hint">
  <p class="hint" id="lock-password-hint"></p>
  <p class="hint" id="lock-configured"></p>
  <label id="l-auto-lock" for="auto-lock"></label>
  <input type="number" id="auto-lock" min="0" max="1440" step="1" required>
  <p class="hint" id="lock-ceiling"></p>
  <button id="privacy-save" type="button"></button>
  <p class="saved" id="privacy-result" role="status"></p>
  </section>
  <section id="panel-llm" tabindex="-1">
  <h2 id="h-llm"></h2>
  <label id="l-url" for="llm-url"></label><input type="text" id="llm-url" maxlength="2048" spellcheck="false">
  <label id="l-name" for="llm-name"></label><input type="text" id="llm-name" maxlength="200" spellcheck="false">
  <label id="l-key" for="llm-key"></label><input type="password" id="llm-key" maxlength="4096" autocomplete="new-password">
  <div class="hint" id="llm-hint"></div>
  <h3 id="h-fallback"></h3>
  <label id="l-fb-url" for="fb-url"></label><input type="text" id="fb-url" maxlength="2048" spellcheck="false">
  <label id="l-fb-name" for="fb-name"></label><input type="text" id="fb-name" maxlength="200" spellcheck="false">
  <label id="l-fb-key" for="fb-key"></label><input type="password" id="fb-key" maxlength="4096" autocomplete="new-password">
  <div class="hint" id="fb-hint"></div>
  <div class="row">
    <button id="llm-save"></button>
    <button id="llm-reset" class="ghost"></button>
    <span class="saved" id="llm-saved"></span>
  </div>
  <div class="live" id="llm-live"></div>
  <h2 id="h-send"></h2>
  <label class="check" for="send-enabled"><input type="checkbox" id="send-enabled" aria-describedby="send-hint"> <span id="send-label"></span></label>
  <p class="hint" id="send-hint"></p>
  <label class="check" for="actions-enabled"><input type="checkbox" id="actions-enabled" aria-describedby="actions-hint"> <span id="actions-label"></span></label>
  <p class="hint" id="actions-hint"></p>
  <label class="check" for="confirm-actions"><input type="checkbox" id="confirm-actions" aria-describedby="confirm-hint"> <span id="confirm-label"></span></label>
  <p class="hint" id="confirm-hint"></p>
  </section>
  <section id="panel-integrations" tabindex="-1">
  <h2 id="h-integrations"></h2>
  <p id="integrations-hint" class="hint"></p>
  <p id="integrations-status" role="status"></p>
  <div id="integrations-fields"></div>
  <button id="integrations-save" type="button"></button>
  <button id="webhook-test" type="button"></button>
  <button id="mcp-copy" type="button"></button>
  <p id="integrations-result" role="status"></p>
  </section>
  <section id="panel-general" tabindex="-1">
  <h2 id="h-notif"></h2>
  <label class="check"><input type="checkbox" id="notif"> <span id="notif-label"></span></label>
  <h2 id="h-lang"></h2>
  <select id="lang"><option value="id">Indonesia</option><option value="en">English</option></select>
  </section>
  <section id="panel-schedule" tabindex="-1">
  <h2 id="h-schedule"></h2>
  <label class="check" for="schedule-enabled"><input type="checkbox" id="schedule-enabled" aria-describedby="schedule-hint"> <span id="schedule-label"></span></label>
  <p class="hint" id="schedule-hint"></p>
  <div id="schedule-list"></div>
  <div class="row">
    <button type="button" id="schedule-save"></button>
    <button type="button" id="schedule-add" class="ghost"></button>
    <span class="saved" id="schedule-saved"></span>
  </div>
  <h2 id="h-schedule-runs"></h2>
  <div id="schedule-runs"></div>
  </section>
  <section id="panel-about" tabindex="-1">
  <h2 id="h-about"></h2>
  <div class="row" id="about-ver"></div>
  <div class="row" id="about-repo"></div>
  </section>
  </main>
</div>
<script>
  const T = window.neko.strings;
  let P = null; // payload settings-get
  const t = k => (T && (T[P?.lang] ?? T.id) || T?.id || {})[k] ?? k;
  const $ = id => document.getElementById(id);
  // Progress backfill per akun: event live (nekochannel:backfill) menang atas snapshot P.backfill.
  const liveBackfill = {};
  const backfillOf = id => (id in liveBackfill ? liveBackfill[id] : P?.backfill?.[id]) || null;
  function renderBackfill() {
    const p = backfillOf($('backfill-account').value);
    const num = n => Number(n || 0).toLocaleString(P?.lang === 'en' ? 'en-US' : 'id-ID');
    const vars = { chats: num(p?.chatIndex), total: num(p?.total), msgs: num(p?.messageCount), detail: String(p?.detail || '').replace(/[.\s]+$/, '') };
    const fmt = key => t(key).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
    const status = p?.status;
    $('backfill-text').textContent = !p || (status === 'idle' && !p.detail) ? t('backfillNone')
      : status === 'idle' ? fmt('backfillWaiting')
      : status === 'running' && !p.total ? t('backfillPreparing')
      : status === 'running' ? fmt('backfillRunning')
      : status === 'paused' ? fmt('backfillPaused')
      : status === 'done' ? fmt('backfillDone')
      : status === 'unsupported' ? t('backfillUnsupported')
      : fmt('backfillFailed');
    const bar = $('backfill-bar');
    bar.hidden = !p || status === 'unsupported' || (status === 'idle' && !p.total);
    bar.dataset.status = status || '';
    if (status === 'running' && !p.total) bar.removeAttribute('value'); // indeterminate: daftar chat belum ada
    else bar.value = status === 'done' ? 100 : p?.total ? Math.round(p.chatIndex / p.total * 100) : 0;
    const off = P?.reader === false;
    $('backfill-start').disabled = off || status === 'running';
    $('backfill-pause').disabled = off || status !== 'running';
  }
  window.neko.onBackfill(({ id, progress }) => { liveBackfill[id] = progress; if (id === $('backfill-account').value) renderBackfill(); });
  const privacyLabels = { enabled: 'privacyBlur', names: 'privacyNames', photos: 'privacyPhotos', previews: 'privacyPreviews', messages: 'privacyMessages', media: 'privacyMedia', compose: 'privacyCompose', accountLabels: 'privacyAccountLabels' };
  const integrationFields = { summary: ['url', 'name', 'key'], jev: ['enabled', 'url', 'key', 'name', 'threshold'], webhook: ['enabled', 'url', 'key'], sentry: ['dsn'], mcp: ['enabled', 'port', 'key', 'remote'] };

  function renderIntegrations() {
    $('h-integrations').textContent = t('integrationsTitle');
    $('integrations-hint').textContent = t('integrationsHint');
    const status = P?.integrationStatus;
    $('integrations-status').textContent = !status?.secure ? t('integrationsLocked') :
      `${t(status.restartRequired ? 'integrationsRestart' : 'integrationsActive')} · MCP: ${status.mcpUrl || t(status.mcpEnabled ? 'integrationsPortError' : 'integrationsOff')} · ${
        status.mcpRemote?.active ? `${t('mcpRemoteActive')} ${status.mcpRemote.address}:${status.mcpRemote.port}`
        : status.mcpRemote?.enabled ? `${t('mcpRemoteError')}: ${status.mcpRemote.error || '?'}` : t('mcpRemoteOff')}`;
    $('integrations-status').title = status?.tailscaleIp ? `${t('mcpTailscaleIp')}: ${status.tailscaleIp}` : t('mcpTailscaleNone');
    const box = $('integrations-fields');
    box.replaceChildren();
    for (const [section, fields] of Object.entries(integrationFields)) {
      const heading = document.createElement('h2'); heading.textContent = t('integration_' + section); box.append(heading);
      const hint = document.createElement('p'); hint.className = 'hint'; hint.textContent = t('integrationHint_' + section); box.append(hint);
      for (const field of fields) {
        const input = document.createElement('input'); input.id = `${section}-${field}`;
        const label = document.createElement('label'); label.htmlFor = input.id; label.textContent = t('integrationField_' + field);
        input.type = ['enabled', 'remote'].includes(field) ? 'checkbox' : ['key', 'dsn'].includes(field) ? 'password' : ['port', 'threshold'].includes(field) ? 'number' : 'text';
        if (['enabled', 'remote'].includes(field)) input.checked = !!P?.integrations?.[section]?.[field];
        else if (['key', 'dsn'].includes(field)) { input.autocomplete = 'new-password'; input.maxLength = field === 'dsn' ? 200 : 4096; input.placeholder = P?.integrations?.[section]?.[field + 'Set'] ? t('llmKeyStored') : ''; }
        else { input.value = P?.integrations?.[section]?.[field] ?? ''; input.maxLength = field === 'url' ? 2048 : 200; }
        if (field === 'port') { input.min = 1; input.max = 65535; input.step = 1; input.required = true; }
        if (field === 'threshold') { input.min = 0; input.max = 1; input.step = 'any'; input.required = true; }
        input.disabled = !status?.secure;
        box.append(label, input);
      }
      if (section === 'mcp') { // #32: IP Tailscale terlihat untuk disalin
        const ip = document.createElement('p'); ip.className = 'hint'; ip.id = 'mcp-tailscale';
        ip.textContent = status?.tailscaleIp ? `${t('mcpTailscaleIp')}: ${status.tailscaleIp} · ${t('mcpRemoteEndpoint')}: http://${status.tailscaleIp}:${P?.integrations?.mcp?.port || 4319}/mcp` : t('mcpTailscaleNone');
        box.append(ip);
      }
      const reset = document.createElement('button'); reset.type = 'button'; reset.className = 'ghost'; reset.textContent = t('integrationReset'); reset.disabled = !status?.secure;
      reset.onclick = async () => {
        if (!confirm(t('integrationResetConfirm'))) return;
        try {
          const result = await window.neko.saveSettings({ integrations: { [section]: { reset: true } } });
          if (result.error) throw new Error();
          P = result; render(); $('integrations-result').textContent = t('integrationsRestart');
        } catch { $('integrations-result').textContent = t('integrationError'); }
      };
      box.append(reset);
    }
    for (const [id, key] of [['integrations-save', 'llmSave'], ['webhook-test', 'webhookTest'], ['mcp-copy', 'mcpCopy']]) {
      $(id).textContent = t(key); $(id).disabled = !status?.secure;
    }
    $('llm-save').disabled = $('llm-reset').disabled = !status?.secure;
  }

  function renderPrivacy() {
    $('h-privacy').textContent = t('secPrivacy');
    for (const [id, key] of Object.entries({ 'privacy-hint': 'privacyHint', 'l-lock-password': 'lockSetPassword', 'lock-password-hint': 'lockPasswordHint', 'l-auto-lock': 'lockAutoMinutes', 'lock-ceiling': 'lockCeiling', 'privacy-save': 'privacySave' })) $(id).textContent = t(key);
    $('lock-configured').textContent = t(P?.privacy?.passwordSet ? 'lockConfigured' : 'lockNotConfigured');
    $('auto-lock').value = P?.privacy?.autoLockMinutes ?? 0;
    const box = $('privacy-targets');
    box.replaceChildren();
    for (const [key, label] of Object.entries(privacyLabels)) {
      const row = document.createElement('label');
      row.className = 'check';
      const input = document.createElement('input');
      input.type = 'checkbox'; input.id = `privacy-${key}`; input.checked = P?.privacy?.[key] ?? true;
      input.onchange = async () => {
        const result = await window.neko.saveSettings({ privacy: { [key]: input.checked } });
        if (result.error) { $('privacy-result').textContent = t('privacyInvalid'); input.checked = !input.checked; }
        else { P = result; renderPrivacy(); }
      };
      row.append(input, document.createTextNode(t(label)));
      box.append(row);
    }
  }

  const sections = [
    ['general', 'secGeneral'], ['reader', 'secReader'], ['privacy', 'secPrivacy'],
    ['integrations', 'integrationsTitle'], ['llm', 'secLlm'], ['schedule', 'secSchedule'], ['about', 'secAbout'],
  ];
  const validSection = id => sections.some(([key]) => key === id);
  let active = 'general';

  function showSection(id, persist = false) {
    if (!validSection(id)) return;
    active = id;
    for (const [key] of sections) {
      document.getElementById('panel-' + key).hidden = key !== id;
      const b = document.getElementById('nav-' + key);
      b.classList.toggle('active', key === id);
      b.setAttribute('aria-current', key === id ? 'page' : 'false');
    }
    document.getElementById('panel-' + id).focus({ preventScroll: true });
    if (persist) window.neko.saveSettings({ settingsSection: id }).catch(() => {});
  }

  function renderNav() { for (const [key, label] of sections) document.getElementById('nav-' + key).textContent = t(label); }

  // ===== #31 Jadwal Agent =====
  // Draf diedit lokal; "Simpan" mengirim seluruh daftar (validasi ketat di main).
  let scheduleDraft = null;
  let scheduleDirty = false; // ada editan belum disimpan → jangan timpa draf dengan data tersimpan
  let scheduleErrors = {}; // id jadwal → kunci pesan; dicek sebelum kirim ke main
  const soleAccount = () => (P?.scheduleAccounts || []).length === 1 ? P.scheduleAccounts[0].jid : '';
  // Aturan sama dengan shell/scheduler.js validate(), tapi per jadwal + pesan jelas.
  const scheduleProblem = item => {
    if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(item.time || '')) return 'scheduleErrTime';
    if (!(item.chats || []).length && !String(item.prompt || '').trim()) return 'scheduleErrEmpty';
    if ((item.chats || []).length > 20) return 'scheduleErrTooMany';
    if (item.sendSelf && !item.account) return 'scheduleErrSelfAccount';
    return null;
  };
  const el = (tag, props = {}, ...children) => { const node = Object.assign(document.createElement(tag), props); node.append(...children); return node; };
  const newScheduleId = () => `j-${Date.now().toString(36)}-${Math.floor(Math.random() * 1e6).toString(36)}`.slice(0, 40);
  function scheduleStatus(id) {
    const state = P?.scheduleState?.[id];
    if (P?.scheduleBusy === id) return t('scheduleStatus_running');
    if (!state?.lastStatus) return t('scheduleNever');
    const when = state.lastAt ? new Date(state.lastAt).toLocaleString(P?.lang === 'en' ? 'en-GB' : 'id-ID') : '';
    const self = state.lastStatus === 'ok' && state.lastSelf ? ` · ${state.lastSelf === 'sent' ? t('scheduleSelfSent') : `${t('scheduleSelfFailed')}${state.lastSelfDetail ? ` (${state.lastSelfDetail})` : ''}`}` : '';
    return `${t('scheduleStatus_' + state.lastStatus) || state.lastStatus} · ${when}${state.lastDetail ? ` · ${state.lastDetail}` : ''}${self}`;
  }
  function renderSchedules() {
    // Render pertama bisa terjadi sebelum settings tiba → selalu sinkron dari data tersimpan kecuali sedang diedit.
    if (!scheduleDraft || !scheduleDirty) scheduleDraft = structuredClone(P?.schedules || { enabled: false, items: [] });
    $('h-schedule').textContent = t('secSchedule');
    $('schedule-label').textContent = t('scheduleEnable');
    $('schedule-hint').textContent = t('scheduleHint');
    $('schedule-enabled').checked = P?.schedules?.enabled === true;
    $('schedule-save').textContent = t('scheduleSave');
    $('schedule-add').textContent = t('scheduleAdd');
    $('h-schedule-runs').textContent = t('scheduleRuns');
    const list = $('schedule-list');
    list.replaceChildren();
    scheduleDraft.items.forEach((item, index) => {
      const box = el('fieldset', { className: 'sched' + (scheduleErrors[item.id] ? ' invalid' : '') });
      const field = (key, labelKey, input) => { input.id = `sched-${index}-${key}`; box.append(el('label', { htmlFor: input.id, textContent: t(labelKey) }), input); return input; };
      const enabled = el('input', { type: 'checkbox', checked: item.enabled });
      enabled.onchange = () => { item.enabled = enabled.checked; scheduleDirty = true; };
      box.append(el('label', { className: 'check' }, enabled, ` ${t('scheduleItemEnabled')}`));
      field('name', 'scheduleName', el('input', { type: 'text', maxLength: 80, value: item.name || '' })).oninput = e => { item.name = e.target.value; scheduleDirty = true; };
      field('time', 'scheduleTime', el('input', { type: 'time', value: item.time || '07:00', required: true })).oninput = e => { item.time = e.target.value; scheduleDirty = true; };
      const account = el('select', {}, el('option', { value: '', textContent: t('scheduleAllAccounts') }), ...(P?.scheduleAccounts || []).map(a => el('option', { value: a.jid, textContent: a.label || a.jid })));
      account.value = item.account || '';
      field('account', 'scheduleAccount', account).onchange = e => { item.account = e.target.value; scheduleDirty = true; renderSchedules(); }; // filter grup ikut akun
      // Grup = daftar centang dari arsip (nama persis), cari + filter akun; nama lama yang tak ada di arsip tetap tampil tercentang.
      const groupsBox = el('div', { className: 'sched-groups' + (P?.privacy?.enabled && P?.privacy?.names ? ' blur' : '') });
      const search = el('input', { type: 'search', id: `sched-${index}-search`, placeholder: t('scheduleGroupSearch') });
      const listEl = el('div', { className: 'sched-group-list', id: `sched-${index}-chats` });
      const count = el('p', { className: 'hint' });
      const pool = [...new Map((P?.scheduleGroups || []).filter(g => !item.account || g.account === item.account).map(g => [g.name, g])).values()];
      const paintGroups = () => {
        const q = search.value.trim().toLowerCase();
        const missing = (item.chats || []).filter(name => !pool.some(g => g.name === name)).map(name => ({ name, missing: true }));
        const rows = [...missing, ...pool].filter(g => !q || g.name.toLowerCase().includes(q));
        count.textContent = `${(item.chats || []).length} ${t('scheduleGroupSelected')}`;
        listEl.replaceChildren(...(rows.length ? rows.map(g => {
          const cb = el('input', { type: 'checkbox', checked: (item.chats || []).includes(g.name) });
          cb.onchange = () => {
            const set = new Set(item.chats || []);
            if (cb.checked) set.add(g.name); else set.delete(g.name);
            item.chats = [...set]; scheduleDirty = true;
            count.textContent = `${item.chats.length} ${t('scheduleGroupSelected')}`;
          };
          const meta = g.missing ? t('scheduleGroupMissing') : `${g.messages} ${t('scheduleGroupMsgs')}${g.last ? ` · ${new Date(g.last).toLocaleDateString(P?.lang === 'en' ? 'en-GB' : 'id-ID')}` : ''}`;
          return el('label', { className: 'check sched-group' }, cb, el('span', { className: 'gname', textContent: g.name }), el('span', { className: 'hint', textContent: meta }));
        }) : [el('p', { className: 'hint', textContent: pool.length ? t('scheduleGroupNoMatch') : t('scheduleGroupEmpty') })]));
      };
      search.oninput = paintGroups;
      groupsBox.append(el('label', { htmlFor: search.id, textContent: t('scheduleChats') }), search, listEl, count);
      box.append(groupsBox);
      paintGroups();
      field('prompt', 'schedulePrompt', el('textarea', { rows: 2, maxLength: 2000, value: item.prompt || '' })).oninput = e => { item.prompt = e.target.value; scheduleDirty = true; };
      const self = el('input', { type: 'checkbox', checked: item.sendSelf === true, id: `sched-${index}-self` });
      self.onchange = () => {
        item.sendSelf = self.checked; scheduleDirty = true;
        if (item.sendSelf && !item.account && soleAccount()) { item.account = soleAccount(); renderSchedules(); } // satu akun → pilih otomatis
      };
      box.append(el('label', { className: 'check', htmlFor: self.id }, self, ` ${t('scheduleSendSelf')}`), el('p', { className: 'hint', textContent: t('scheduleSendSelfHint') }));
      const state = P?.scheduleState?.[item.id];
      box.append(el('p', { className: 'hint', textContent: `${t('scheduleLast')}: ${scheduleStatus(item.id)}` }));
      if (state?.lastText) box.append(el('details', {}, el('summary', { textContent: t('scheduleLastResult') }), el('pre', { textContent: state.lastText })));
      const run = el('button', { type: 'button', textContent: t('scheduleRunNow') });
      const saved = P?.schedules?.items?.some(entry => entry.id === item.id);
      run.disabled = !saved || P?.scheduleBusy === item.id;
      run.title = saved ? '' : t('scheduleSaveFirst');
      run.onclick = async () => {
        run.disabled = true; $('schedule-saved').textContent = t('scheduleStatus_running');
        try { const r = await window.neko.runSchedule(item.id); $('schedule-saved').textContent = r?.status === 'ok' ? t('scheduleStatus_ok') : `${t('scheduleStatus_failed')}: ${r?.detail || r?.status || ''}`; }
        catch { $('schedule-saved').textContent = t('integrationError'); }
        P = await window.neko.getSettings(); renderSchedules();
      };
      const del = el('button', { type: 'button', className: 'ghost', textContent: t('scheduleDelete') });
      del.onclick = () => { scheduleDraft.items.splice(index, 1); scheduleDirty = true; renderSchedules(); };
      box.append(el('div', { className: 'row' }, run, del));
      if (scheduleErrors[item.id]) box.append(el('p', { className: 'sched-err', role: 'alert', textContent: t(scheduleErrors[item.id]) }));
      list.append(box);
    });
    $('schedule-add').disabled = scheduleDraft.items.length >= 20;
    const runs = $('schedule-runs');
    runs.replaceChildren(...((P?.scheduleRuns || []).length ? P.scheduleRuns.map(r => el('div', { className: 'sched-run',
      textContent: `${new Date(r.ts).toLocaleString(P?.lang === 'en' ? 'en-GB' : 'id-ID')} · ${r.name || r.id} · ${t('scheduleStatus_' + r.status) || r.status}${r.manual ? ` (${t('scheduleManual')})` : ''}${r.detail ? ` · ${r.detail}` : ''}${r.self ? ` · ${r.self === 'sent' ? t('scheduleSelfSent') : t('scheduleSelfFailed')}` : ''}` }))
      : [el('div', { className: 'sched-run', textContent: t('scheduleNoRuns') })]));
  }
  $('schedule-add').onclick = () => {
    scheduleDraft.items.push({ id: newScheduleId(), name: '', enabled: true, time: '07:00', account: soleAccount(), chats: [], prompt: '', sendSelf: false });
    scheduleDirty = true;
    renderSchedules();
  };
  $('schedule-save').onclick = async () => {
    scheduleErrors = {};
    for (const item of scheduleDraft.items) { const problem = scheduleProblem(item); if (problem) scheduleErrors[item.id] = problem; }
    const bad = scheduleDraft.items.find(item => scheduleErrors[item.id]);
    if (bad) { // tunjukkan jadwal & alasannya, jangan kirim
      renderSchedules();
      $('schedule-saved').textContent = `${t('scheduleInvalidOne')} «${bad.name || `#${scheduleDraft.items.indexOf(bad) + 1}`}»: ${t(scheduleErrors[bad.id])}`;
      return;
    }
    try {
      const result = await window.neko.saveSettings({ schedules: { items: scheduleDraft.items } });
      if (result.error) throw Object.assign(new Error(result.error), { detail: result.detail });
      P = result; scheduleDraft = null; scheduleDirty = false; renderSchedules(); $('schedule-saved').textContent = t('scheduleSaved');
    } catch (error) { $('schedule-saved').textContent = `${t('scheduleInvalid')}${error.detail ? ` (${error.detail})` : ''}`; }
  };
  $('schedule-enabled').onchange = async e => {
    e.target.disabled = true;
    try { const result = await window.neko.saveSettings({ schedules: { enabled: e.target.checked } }); if (result.error) throw new Error(result.error); P = result; }
    catch { e.target.checked = P?.schedules?.enabled === true; }
    finally { e.target.disabled = false; }
  };
  window.neko.onSchedule?.(async () => { P = await window.neko.getSettings(); renderSchedules(); }); // run selesai → status/hasil terbaru (draf tetap)

  function render() {
    renderNav();
    renderIntegrations();
    renderSchedules();
    $('h-reader').textContent = t('secReader');
    $('reader-label').textContent = t('readerMaster');
    $('reader-hint').textContent = t('readerHint');
    $('backfill-account-label').textContent = t('backfillAccount');
    $('reader').checked = P?.reader !== false;
    const selected = $('backfill-account').value;
    $('backfill-account').replaceChildren(...(P?.accountsList || []).map(account => {
      const option = document.createElement('option'); option.value = account.id; option.textContent = account.label; return option;
    }));
    if ([...$('backfill-account').options].some(option => option.value === selected)) $('backfill-account').value = selected;
    $('backfill-start').textContent = t('backfillStart');
    $('backfill-pause').textContent = t('backfillPause');
    renderBackfill();
    renderPrivacy();
    document.documentElement.lang = P?.lang === 'en' ? 'en' : 'id';
    $('h-llm').textContent = t('secLlm');
    $('llm-url').value = P?.llm?.url || '';
    $('llm-name').value = P?.llm?.name || '';
    $('llm-key').value = ''; // write-only: isian yang sudah tersimpan tidak pernah dibalikkan
    $('l-url').textContent = t('llmUrl'); $('l-name').textContent = t('llmName'); $('l-key').textContent = t('llmKey');
    $('llm-hint').textContent = t('llmHint');
    $('llm-key').placeholder = P?.llm?.keySet ? t('llmKeyStored') : '';
    $('h-fallback').textContent = t('llmFallbackTitle');
    $('l-fb-url').textContent = t('llmUrl'); $('l-fb-name').textContent = t('llmName'); $('l-fb-key').textContent = t('llmKey');
    $('fb-url').value = P?.llm?.fallback?.url || '';
    $('fb-name').value = P?.llm?.fallback?.name || '';
    $('fb-key').value = ''; // write-only
    $('fb-key').placeholder = P?.llm?.fallback?.keySet ? t('llmKeyStored') : '';
    $('fb-hint').textContent = t('llmFallbackHint');
    $('llm-save').textContent = t('llmSave');
    $('llm-reset').textContent = t('llmReset'); $('llm-reset').classList.remove('armed');
    $('llm-live').textContent = `${t('llmLive')}: ${P?.liveModel || t('llmLiveOff')}`;
    $('h-notif').textContent = t('secNotif');
    $('notif-label').textContent = t('secNotif');
    document.title = t('settingsTitle');
    $('notif').checked = !!P?.notif;
    $('h-send').textContent = t('secSend');
    $('send-label').textContent = t('sendToggle');
    $('send-hint').textContent = t('sendHint');
    $('send-enabled').checked = P?.sendEnabled === true;
    $('actions-label').textContent = t('actionsToggle');
    $('actions-hint').textContent = t('actionsHint');
    $('actions-enabled').checked = P?.actionsEnabled === true;
    $('confirm-label').textContent = t('confirmToggle');
    $('confirm-hint').textContent = t('confirmHint');
    $('confirm-actions').checked = P?.confirmActions !== false;
    $('h-lang').textContent = t('secLang');
    $('lang').value = P?.lang || 'id';
    $('h-about').textContent = t('secAbout');
    $('about-ver').textContent = `${t('aboutVersion')}: ${P?.about?.version || '?'}`;
    const repo = P?.about?.repo || '';
    $('about-repo').textContent = '';
    if (repo) {
      const lab = document.createElement('span'); lab.textContent = `${t('aboutRepo')}: `;
      const a = document.createElement('a'); a.href = repo; a.textContent = repo;
      $('about-repo').append(lab, a);
    }
  }

  async function refresh() {
    render();
    P = await window.neko.getSettings();
    if (validSection(P?.settingsSection)) active = P.settingsSection;
    render();
    showSection(active);
  }
  let connectedSig = '';
  window.neko.onState(async state => {
    if (!P || state.locked) return;
    const labels = state.accounts.map(({ id, label, icon }) => ({ id, label, icon }));
    // Akun baru connected (nomor terdeteksi) → muat ulang: daftar akun & grup Jadwal Agent ikut terisi.
    const sig = state.accounts.filter(a => a.status?.state === 'connected').map(a => a.id).join(',');
    const connectedChanged = sig !== connectedSig;
    connectedSig = sig;
    if (!connectedChanged && state.reader === P.reader && state.lang === P.lang && JSON.stringify(state.privacy) === JSON.stringify(P.privacy) && JSON.stringify(labels) === JSON.stringify(P.accountsList)) return;
    const next = await window.neko.getSettings();
    if (!next.error) { P = next; render(); }
  });
  $('privacy-save').onclick = async () => {
    const password = $('lock-password');
    const idle = $('auto-lock');
    if (!password.checkValidity() || !idle.checkValidity()) { $('privacy-result').textContent = t('privacyInvalid'); return; }
    const patch = { autoLockMinutes: Number(idle.value) };
    if (password.value) patch.password = password.value;
    $('privacy-save').disabled = true;
    try {
      const result = await window.neko.saveSettings({ privacy: patch });
      if (result.error) { $('privacy-result').textContent = t('privacyInvalid'); return; }
      password.value = ''; P = result; renderPrivacy();
      $('privacy-result').textContent = t('privacySaved');
    } catch { $('privacy-result').textContent = t('privacyInvalid'); }
    finally { $('privacy-save').disabled = false; }
  };

  $('integrations-save').onclick = async () => {
    const integrations = {};
    for (const [section, fields] of Object.entries(integrationFields)) {
      integrations[section] = {};
      for (const field of fields) {
        const input = $(`${section}-${field}`);
        if (!input.reportValidity()) return;
        integrations[section][field] = ['enabled', 'remote'].includes(field) ? input.checked : ['port', 'threshold'].includes(field) ? Number(input.value) : input.value;
      }
    }
    try {
      const result = await window.neko.saveSettings({ integrations });
      if (result.error) throw new Error();
      P = result; render(); $('integrations-result').textContent = t('integrationsRestart');
    } catch { $('integrations-result').textContent = t('integrationError'); }
  };
  $('webhook-test').onclick = async () => {
    if (!confirm(t('webhookTestConfirm'))) return;
    $('webhook-test').disabled = true;
    try {
      const result = await window.neko.testWebhook();
      $('integrations-result').textContent = t(result.ok ? 'webhookTestOk' : 'webhookTestFailed');
    } catch { $('integrations-result').textContent = t('webhookTestFailed'); }
    finally { $('webhook-test').disabled = false; }
  };
  $('mcp-copy').onclick = async () => {
    try { const result = await window.neko.copyMcpKey(); $('integrations-result').textContent = t(result.ok ? 'mcpCopied' : 'integrationError'); }
    catch { $('integrations-result').textContent = t('integrationError'); }
  };
  $('llm-save').onclick = async () => {
    try {
      const result = await window.neko.saveSettings({ llm: { url: $('llm-url').value, name: $('llm-name').value, key: $('llm-key').value },
        integrations: { fallback: { url: $('fb-url').value, name: $('fb-name').value, key: $('fb-key').value } } });
      $('llm-key').value = ''; $('fb-key').value = '';
      if (result.error) throw new Error();
      P = result; render(); $('llm-saved').textContent = t('llmSaved');
    } catch { $('llm-saved').textContent = t('integrationError'); }
  };
  $('llm-reset').onclick = async e => {
    const b = e.currentTarget;
    if (!b.dataset.armed) { b.dataset.armed = '1'; b.classList.add('armed'); b.textContent = t('llmResetArmed'); return; }
    delete b.dataset.armed;
    P = await window.neko.saveSettings({ llmReset: true });
    if (P.error) { $('llm-saved').textContent = t('integrationError'); P = await window.neko.getSettings(); return; }
    $('llm-saved').textContent = t('llmSaved');
    render();
    setTimeout(() => { $('llm-saved').textContent = ''; }, 6000);
  };
  $('notif').onchange = async e => { P = await window.neko.saveSettings({ notif: e.target.checked }); };
  $('reader').onchange = async event => {
    event.target.disabled = true;
    $('reader-result').textContent = '';
    try {
      const result = await window.neko.saveSettings({ reader: event.target.checked });
      if (result.error) throw new Error(result.error);
      P = result;
    } catch { $('reader-result').textContent = t('readerSaveError'); }
    finally { event.target.disabled = false; render(); }
  };
  for (const action of ['start', 'pause']) $('backfill-' + action).onclick = async () => {
    if (action === 'start' && !confirm(t('backfillConfirm'))) return;
    try {
      const id = $('backfill-account').value;
      const result = await window.neko.readerBackfill(id, action);
      $('reader-result').textContent = result.error ? t('backfillError') : '';
      if (!result.error && result.progress) { liveBackfill[id] = result.progress; renderBackfill(); }
    } catch { $('reader-result').textContent = t('backfillError'); }
  };
  $('backfill-account').onchange = () => { $('reader-result').textContent = ''; renderBackfill(); };
  // Kirim pesan Agent/MCP: hanya bisa dinyalakan manual di sini (default OFF).
  $('send-enabled').onchange = async e => {
    e.target.disabled = true;
    try { const result = await window.neko.saveSettings({ sendEnabled: e.target.checked }); if (result.error) throw new Error(result.error); P = result; }
    catch { e.target.checked = P?.sendEnabled === true; }
    finally { e.target.disabled = false; }
  };
  // Aksi chat Agent/MCP (wa_action): sama, hanya manual di sini (default OFF).
  $('actions-enabled').onchange = async e => {
    e.target.disabled = true;
    try { const result = await window.neko.saveSettings({ actionsEnabled: e.target.checked }); if (result.error) throw new Error(result.error); P = result; }
    catch { e.target.checked = P?.actionsEnabled === true; }
    finally { e.target.disabled = false; }
  };
  // Konfirmasi native (default ON): OFF hanya manual di sini.
  $('confirm-actions').onchange = async e => {
    e.target.disabled = true;
    try { const result = await window.neko.saveSettings({ confirmActions: e.target.checked }); if (result.error) throw new Error(result.error); P = result; }
    catch { e.target.checked = P?.confirmActions !== false; }
    finally { e.target.disabled = false; }
  };
  $('lang').onchange = async e => { P = await window.neko.saveSettings({ lang: e.target.value }); render(); };
  const navBox = document.getElementById('settings-nav');
  $('settings-close').onclick = () => window.neko.openSettings();
  for (const [key] of sections) {
    const b = document.getElementById('nav-' + key);
    b.dataset.section = key;
    b.onclick = () => showSection(key, true);
  }
  navBox.addEventListener('keydown', e => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    const i = sections.findIndex(([key]) => key === active);
    const next = sections[(i + (e.key === 'ArrowDown' ? 1 : sections.length - 1)) % sections.length][0];
    showSection(next, true);
    document.getElementById('nav-' + next).focus();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.preventDefault(); setTimeout(() => window.neko.openSettings()); return; }
    const n = Number((e.altKey && /^Digit[1-7]$/.test(e.code)) ? e.code.slice(5) : 0);
    if (n) { e.preventDefault(); showSection(sections[n - 1][0], true); }
  });

  refresh();
</script>
</body>
</html>
