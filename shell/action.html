<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Action</title>
<style>
  :root { --bg: #111b21; --panel: #202c33; --txt: #e9edef; --dim: #8696a0;
    --border: #2a3942; --ok: #25d366; --warn: #f2c33c; --err: #f15c6d; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f0f2f5; --panel: #ffffff; --txt: #111b21; --dim: #667781; --border: #d1d7db; }
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--txt);
    font: 13px/1.5 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; height: 100vh; }
  header { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
  header .master { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; }
  header .master input { width: 17px; height: 17px; accent-color: var(--ok); }
  header .meta { color: var(--dim); font-size: 12px; margin-top: 6px; }
  header .meta .on { color: var(--ok); } header .meta .off { color: var(--err); }
  #log { flex: 1; overflow-y: auto; padding: 10px 16px 16px; }
  .empty { color: var(--dim); margin-top: 14px; }
  .ev { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    margin: 6px 0; background: var(--panel); }
  .ev .head { display: flex; gap: 8px; align-items: baseline; }
  .ev .kind { flex: none; font-size: 11px; text-transform: uppercase; letter-spacing: .03em;
    padding: 1px 7px; border-radius: 9px; color: #111b21; background: var(--dim); }
  .ev.reply .kind, .ev.sent .kind { background: var(--ok); }
  .ev.defer .kind { background: var(--warn); }
  .ev.error .kind { background: var(--err); }
  .ev.info .kind { color: var(--txt); }
  .ev .acct { font-weight: 600; }
  .ev .chat { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  .ev .detail { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .ev .text { margin-top: 5px; white-space: pre-wrap; word-break: break-word;
    background: var(--bg); border-radius: 6px; padding: 6px 8px; }
  .ev .ts { margin-left: auto; color: var(--dim); font-size: 11px; flex: none; }
</style>
</head>
<body>
  <header>
    <label class="master"><input type="checkbox" id="master"> <span id="master-label"></span></label>
    <div class="meta" id="meta"></div>
  </header>
  <div id="log"><div class="empty" id="empty"></div></div>
<script>
  const T = window.neko.strings;
  let lang = 'id';
  const t = k => (T?.[lang] ?? T?.id ?? {})[k] ?? k;
  const $ = id => document.getElementById(id);
  const KIND = { reply: 'reply', sent: 'sent', defer: 'defer', skip: 'skip', error: 'error', info: 'info' };

  const chatShort = c => String(c || '').replace(/@(c\.us|g\.us|lid|s\.whatsapp\.net)$/i, '');
  const fmt = ts => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  function renderMeta(S) {
    const llm = S.llm?.url && S.llm?.name
      ? `<span class="on">LLM ✓</span> ${S.llm.name}` : `<span class="off">${t('apNoLlm')}</span>`;
    const pend = S.pending ? ` · ${S.pending} ${t('apPending')}` : '';
    const acc = Object.entries(S.accounts || {}).filter(([, v]) => v).length;
    $('meta').innerHTML = `${llm} · master <b class="${S.master ? 'on' : 'off'}">${S.master ? 'ON' : 'OFF'}</b> · ${acc} akun ON${pend}`;
  }

  function addEvent(ev) {
    $('empty').style.display = 'none';
    const div = document.createElement('div');
    div.className = `ev ${ev.kind}`;
    const head = document.createElement('div'); head.className = 'head';
    const kind = document.createElement('span'); kind.className = 'kind'; kind.textContent = KIND[ev.kind] || ev.kind;
    const acct = document.createElement('span'); acct.className = 'acct'; acct.textContent = ev.account ? chatShort(ev.account) : '';
    const chat = document.createElement('span'); chat.className = 'chat'; chat.textContent = ev.chat ? chatShort(ev.chat) : '';
    const ts = document.createElement('span'); ts.className = 'ts'; ts.textContent = fmt(ev.ts);
    head.append(kind, acct, chat, ts);
    div.appendChild(head);
    if (ev.detail) { const d = document.createElement('div'); d.className = 'detail'; d.textContent = ev.detail; div.appendChild(d); }
    if (ev.text) { const x = document.createElement('div'); x.className = 'text'; x.textContent = ev.text; div.appendChild(x); }
    const log = $('log');
    log.insertBefore(div, log.querySelector('.ev'));
  }

  async function refresh() {
    const S = await window.neko.getAction();
    $('master').checked = !!S.master;
    $('master-label').textContent = t('actionMaster');
    document.documentElement.lang = lang;
    $('empty').textContent = S.events?.length ? '' : t('apEmpty');
    $('empty').style.display = S.events?.length ? 'none' : 'block';
    $('log').querySelectorAll('.ev').forEach(e => e.remove());
    for (const ev of (S.events || [])) addEvent(ev);
    renderMeta(S);
  }

  $('master').onchange = e => window.neko.setActionMaster(e.target.checked);
  window.neko.onAction(ev => { addEvent(ev); window.neko.getAction().then(renderMeta); });
  window.neko.state().then(s => { lang = s.lang === 'en' ? 'en' : 'id'; refresh(); });
  refresh();
</script>
</body>
</html>
