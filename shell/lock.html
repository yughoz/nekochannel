<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Nekochannel</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; background: #111b21; color: #e9edef; font: 16px system-ui, sans-serif; }
body { display: grid; place-items: center; }
form { width: min(360px, 80vw); }
input, button { box-sizing: border-box; width: 100%; padding: 12px; margin-top: 12px; font: inherit; }
button { cursor: pointer; background: #25d366; color: #111b21; border: 0; }
p { color: #8696a0; font-size: 13px; }
#error { color: #ff9eaa; min-height: 2em; }
</style>
</head>
<body>
<form id="unlock"><h1 id="title">Nekochannel</h1><p id="ceiling"></p>
<label id="label" for="password"></label><input id="password" type="password" autocomplete="current-password" required maxlength="256" autofocus>
<button id="submit" type="submit"></button><p id="error" role="alert"></p></form>
<script>
let strings = {};
window.lock.onStrings(value => {
  strings = value;
  document.documentElement.lang = value.lang;
  for (const [id, key] of Object.entries({ title: 'lockTitle', ceiling: 'lockCeiling', label: 'lockPassword', submit: 'lockUnlock' })) document.getElementById(id).textContent = value[key];
});
document.getElementById('unlock').onsubmit = async event => {
  event.preventDefault();
  const input = document.getElementById('password');
  const button = document.getElementById('submit');
  button.disabled = true;
  try {
    const result = await window.lock.unlock(input.value);
    input.value = '';
    if (!result.ok) document.getElementById('error').textContent = strings.lockIncorrect;
  } catch { document.getElementById('error').textContent = strings.lockIncorrect; }
  finally { button.disabled = false; input.focus(); }
};
</script>
</body>
</html>
