<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WA Engine</title>
<style>
  :root { --bg:#0e1621; --panel:#15202b; --line:#223140; --bubble-u:#1f3a54; --bubble-a:#1c2a36;
    --txt:#e9edef; --dim:#7d94a5; --accent:#1769aa; --err:#f15c6d; --ok:#25d366; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--txt);
    font:14px/1.5 system-ui, sans-serif; }
  body { display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; padding:10px 14px;
    background:var(--panel); border-bottom:1px solid #0a121b; flex:none; }
  header h1 { font-size:14px; margin:0; font-weight:600; white-space:nowrap; }
  #dot { width:9px; height:9px; border-radius:50%; background:var(--dim); flex:none; }
  #dot.ok { background:var(--ok); }
  #dot.err { background:var(--err); }
  #session { color:var(--dim); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  #modelinfo { color:var(--dim); font-size:12px; margin-left:auto; flex:none; }
  #clear { background:none; border:1px solid var(--line); color:var(--dim); border-radius:6px;
    font:inherit; font-size:12px; padding:3px 10px; cursor:pointer; }
  #clear:hover { color:var(--txt); border-color:var(--dim); }
  #banner { display:none; padding:8px 14px; background:#3d1f24; color:var(--err);
    font-size:13px; flex:none; }
  #banner code { font-family:ui-monospace, monospace; }
  #log { flex:1; overflow-y:auto; padding:14px; }
  #log > .pane { display:flex; flex-direction:column; gap:10px; }
  .row { max-width:78%; padding:8px 12px; border-radius:10px; overflow-wrap:anywhere; }
  .row.user { align-self:flex-end; background:var(--bubble-u); border-bottom-right-radius:3px; }
  .row.agent { align-self:flex-start; background:var(--bubble-a); border-bottom-left-radius:3px; }
  .row.agent.err { background:#3d1f24; color:var(--err); }
  .row code { background:#0a121b; border-radius:4px; padding:1px 5px;
    font-family:ui-monospace, monospace; font-size:13px; }
  .row ul { margin:4px 0; padding-left:18px; }
  .row strong { font-weight:600; }
  .cursor { display:inline-block; width:8px; height:15px; background:var(--accent);
    margin-left:2px; vertical-align:-2px; animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  details.chip { align-self:flex-start; max-width:78%; font-size:12px; color:var(--dim);
    background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:4px 10px; }
  details.chip summary { cursor:pointer; user-select:none; }
  details.chip pre { margin:6px 0 2px; overflow:auto; max-height:180px; font-size:11px; }
  footer { display:flex; align-items:flex-end; gap:8px; padding:10px 14px;
    background:var(--panel); border-top:1px solid #0a121b; flex:none; }
  #input { flex:1; resize:none; background:#0a121b; color:var(--txt); border:1px solid var(--line);
    border-radius:10px; padding:9px 12px; font:inherit; height:40px; max-height:140px; }
  #input:focus { outline:none; border-color:var(--accent); }
  #send { background:var(--accent); color:#fff; border:none; border-radius:10px;
    padding:9px 18px; font:inherit; cursor:pointer; }
  #send:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
  <header>
    <span id="dot"></span><h1>WA Engine</h1><span id="session"></span>
    <span id="modelinfo"></span>
    <button id="clear" title="Kosongkan riwayat percakapan sesi ini">Bersihkan</button>
  </header>
  <div id="banner">Server chat tidak merespons — jalankan: <code>systemctl --user start wa-reader-chat</code></div>
  <div id="log"></div>
  <footer>
    <textarea id="input" placeholder="Tanya arsip WA atau minta kirim pesan…" rows="1"></textarea>
    <button id="send">Kirim</button>
  </footer>
  <script src="app.js"></script>
</body>
</html>
